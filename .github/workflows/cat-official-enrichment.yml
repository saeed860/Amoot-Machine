name: Enrich Official Cat Part Search Metadata

on:
  push:
    branches: [main]
    paths:
      - "scripts/cat-official-enrichment-input.json"
      - "scripts/cat-official-detail-enrichment.mjs"
      - "scripts/build-cat-official-enrichment-migration.mjs"
      - ".github/workflows/cat-official-enrichment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Extract official Cat descriptions, fitment and specifications
        run: node scripts/cat-official-detail-enrichment.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Create migration using Supabase CLI
        run: supabase migration new cat_official_product_detail_enrichment
      - name: Build idempotent enrichment migration
        run: node scripts/build-cat-official-enrichment-migration.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/
          git commit -m "catalog: enrich Cat part search metadata from official pages"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-official-enrichment
          path: artifacts/cat-official-enrichment.json
          if-no-files-found: warn
          retention-days: 14
