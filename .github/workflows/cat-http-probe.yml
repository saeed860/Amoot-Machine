name: Cat Parts HTTP fetch probe
on:
  push:
    branches: [main]
    paths:
      - "scripts/cat-http-probe.mjs"
      - ".github/workflows/cat-http-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cat-http-probe.mjs
