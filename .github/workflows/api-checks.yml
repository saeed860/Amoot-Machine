name: Amoot API checks
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-checks.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-checks.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/amoot_test
      - run: node --check src/server.js
      - run: node --check prisma/seed.js
      - run: node --check scripts/smoke-test.js
      - run: npx prisma generate
