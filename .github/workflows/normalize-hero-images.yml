name: Normalize hero banner images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-hero-images.yml"
      - "assets/hero-*.jpg"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize all hero images to the first image dimensions
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          files = [
              Path("assets/hero-excavator.jpg"),
              Path("assets/hero-jackup-rig.jpg"),
              Path("assets/hero-supply-vessel.jpg"),
              Path("assets/hero-cat-3516b.jpg"),
          ]
          with Image.open(files[0]) as first:
              target = first.size
          for path in files:
              with Image.open(path) as source:
                  image = ImageOps.fit(
                      source.convert("RGB"),
                      target,
                      method=Image.Resampling.LANCZOS,
                      centering=(0.5, 0.5),
                  )
                  image.save(path, "JPEG", quality=90, optimize=True, progressive=True)
              with Image.open(path) as check:
                  assert check.size == target, (path, check.size, target)
              print(f"PASS {path}: {target[0]}x{target[1]}")
          PY
      - name: Commit normalized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Normalize hero banner images to a shared size"
            git push
          else
            echo "All hero images already match."
          fi
