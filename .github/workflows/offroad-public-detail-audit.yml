name: Off Road Public 500 Price and Part Detail Audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/offroad-public-detail-audit.mjs"
      - ".github/workflows/offroad-public-detail-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Audit public Off Road detail pages (no login or gated endpoints)
        run: node scripts/offroad-public-detail-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offroad-500-detail-audit
          path: artifacts/offroad-500-detail-audit.json
          if-no-files-found: error
          retention-days: 14
