name: Validate official Cat data migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*cat*.sql"
      - ".github/workflows/cat-official-correction.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cat migration files
        shell: bash
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*cat*.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            grep -Eiq 'UPDATE[[:space:]]+public\.part_catalog|UPDATE[[:space:]]+public\.products' "$file" || {
              echo "No Cat catalog/product update found in $file"
              exit 1
            }
          done
