name: Validate researched Cat price migration

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*researched_cat_part_prices.sql"
      - ".github/workflows/cat-official-correction.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate researched Cat price migration
        shell: bash
        run: |
          files=(supabase/migrations/*researched_cat_part_prices.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            grep -q "UPDATE public.products" "$file" || {
              echo "No product price update found in $file"
              exit 1
            }
            grep -q "CAT-7W-0009" "$file"
            grep -q "CAT-5N-4504" "$file"
            grep -q "CAT-8T-6765" "$file"
          done
