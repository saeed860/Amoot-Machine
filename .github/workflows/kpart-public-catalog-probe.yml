name: K-Part Public Catalog Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kpart-public-catalog-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Inspect and navigate public CAT catalog
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const requests=[], responses=[], actions=[];
          page.on('request', req => {
            const u=new URL(req.url());
            if(u.hostname==='k-part.com'||u.hostname.endsWith('.k-part.com')) requests.push({method:req.method(),url:req.url(),resourceType:req.resourceType(),postData:req.postData()?.slice(0,12000)||null});
          });
          page.on('response', async res => {
            const u=new URL(res.url());
            if(!(u.hostname==='k-part.com'||u.hostname.endsWith('.k-part.com'))) return;
            const h=res.headers(), type=h['content-type']||'';
            const item={url:res.url(),status:res.status(),contentType:type};
            if(/json|text\//i.test(type)&&Number(h['content-length']||0)<1500000){try{item.body=(await res.text()).slice(0,500000)}catch{}}
            responses.push(item);
          });
          let error=null;
          try {
            await page.goto('https://k-part.com/chat?catalog_brand=cat&catalog_model=m325b-bgn',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(7000);
            const consent=page.getByRole('button',{name:'Accept',exact:true});
            if(await consent.count()) { await consent.first().click().catch(()=>{}); actions.push('accepted required-cookie notice'); }
            await page.waitForTimeout(2500);
            const card=page.getByRole('button',{name:/M325B\s*\/\s*BGN/});
            if(await card.count()){await card.first().click();actions.push('clicked M325B / BGN catalog card');}
            await page.waitForTimeout(12000);
            const body=await page.locator('body').innerText();
            const controls=await page.locator('input,button,select,[role=button]').evaluateAll(xs=>xs.slice(0,250).map(x=>({tag:x.tagName,type:x.type||'',text:(x.innerText||x.getAttribute('aria-label')||'').trim().slice(0,160),placeholder:x.placeholder||'',name:x.name||'',value:x.value||''})));
            await writeFile('artifacts/kpart-interactive-probe.json',JSON.stringify({url:page.url(),error,actions,text:body.slice(0,40000),controls,requests,responses},null,2));
          } catch(e){error=e.message; await writeFile('artifacts/kpart-interactive-probe.json',JSON.stringify({error,actions,requests,responses},null,2));}
          finally{await browser.close();}
          console.log(JSON.stringify({error,actions,requests:requests.length,responses:responses.length,apiResponses:responses.filter(x=>x.url.includes('aiChatProxy')).map(x=>({status:x.status,body:x.body?.slice(0,1600)}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpart-interactive-probe
          path: artifacts/kpart-interactive-probe.json
          if-no-files-found: warn
          retention-days: 7
