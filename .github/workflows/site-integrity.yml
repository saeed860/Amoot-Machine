name: Amoot Site Integrity
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "cart.js"
      - "api-client.js"
      - "api-config.js"
      - "offroad-catalog.js"
      - "style.css"
      - "search.html"
      - "search.js"
      - "search.css"
      - "prices.html"
      - "assets/**"
      - ".github/workflows/site-integrity.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "cart.js"
      - "api-client.js"
      - "api-config.js"
      - "style.css"
      - "search.html"
      - "search.js"
      - "search.css"
      - "prices.html"
      - "assets/**"
      - ".github/workflows/site-integrity.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser JavaScript
        run: |
          node --check app.js
          node --check cart.js
          node --check api-client.js
          node --check api-config.js
          node --check offroad-catalog.js
          node --check search.js
          grep -q 'machine_model: clean(body.machineModel,120)' supabase/functions/store-api/index.ts
          grep -q 'data-open-quote' search.js
          grep -q 'stock-state' search.js
      - name: Verify secure account password flow
        run: |
          grep -Fq 'path === "/api/me/password"' supabase/functions/store-api/index.ts
          grep -Fq 'admin.updateUserById' supabase/functions/store-api/index.ts
          grep -Fq "renderServerSecurity(host)" api-client.js
          grep -Fq "api('/api/me/password'" api-client.js
          grep -Fq "const serverRows=Array.isArray(rows)?rows:[]" app.js
          grep -Fq "seed.filter(p=>!known.has(p.sku||String(p.id)))" app.js
          grep -Fq "const seed=(window.AMOOT_OFFROAD_CATALOG||[])" app.js
          grep -Fq "category=document.querySelector('.cat.active')" api-client.js
          grep -Fq "String(z.id)===String(x.productId)" cart.js
          grep -Fq "price:p.priceIrr===null?0:Number(p.priceIrr)/10" api-client.js
          grep -Fq 'const productMatch = path.match' supabase/functions/store-api/index.ts
          grep -Fq "api('/api/admin/products/'+encodeURIComponent(p.sku)" api-client.js
          grep -Fq 'function openProductEditor(p)' api-client.js
          grep -Fq 'factor:1.65' offroad-catalog.js
          grep -Fq "amootCurrency:'USD'" offroad-catalog.js
          grep -Fq 'INVALID_ORDER_TRANSITION' api/src/server.js
          grep -Fq 'Cancellation restores inventory exactly once' api/scripts/smoke-test.js
      - name: Verify Off Road catalog pricing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('offroad-catalog.js', 'utf8'), context);
          const rows = context.window.AMOOT_OFFROAD_CATALOG;
          if (!Array.isArray(rows) || rows.length < 500) throw new Error('Off Road catalog has fewer than 500 products');
          const seen = new Set();
          for (const p of rows) {
            const sku = String(p.sku || '').replace(/[^A-Z0-9]/gi, '').toUpperCase();
            if (!sku || seen.has(sku)) throw new Error('Missing or duplicate SKU: ' + p.sku);
            seen.add(sku);
            const r = p.priceReference;
            if (!r || r.currency !== 'USD' || r.amootCurrency !== 'USD' || r.factor !== 1.65) throw new Error('Missing USD price reference: ' + p.sku);
            if (Math.abs(Number(r.amount) * 1.65 - Number(r.amootAmount)) > 0.011) throw new Error('Incorrect Amoot price: ' + p.sku);
          }
          console.log('Verified', rows.length, 'unique products with USD prices at 1.65x.');
          NODE
      - name: Verify local page assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['index.html','app.js','cart.js','api-client.js','api-config.js','offroad-catalog.js','style.css','search.html','search.js','search.css'];
          const text = files.map(f => fs.readFileSync(f,'utf8')).join('\n');
          const refs = new Set([...text.matchAll(/(?:\.\/assets\/[A-Za-z0-9._/-]+|\.\/style\.css|\.\/app\.js|\.\/cart\.js|\.\/api-client\.js|\.\/api-config\.js|\.\/offroad-catalog\.js|\.\/search\.js|\.\/search\.css)/g)].map(m=>m[0]));
          const missing = [...refs].filter(p => !fs.existsSync(p.slice(2)));
          if (missing.length) { console.error('Missing local assets:', missing); process.exit(1); }
          console.log('Verified', refs.size, 'local asset references.');
          NODE
