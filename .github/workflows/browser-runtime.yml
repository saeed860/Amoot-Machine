name: Amoot Browser Runtime Test
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "cart.js"
      - "api-client.js"
      - "api-config.js"
      - "offroad-catalog.js"
      - "style.css"
      - "search.html"
      - "search.js"
      - "search.css"
      - "supabase/functions/store-api/index.ts"
      - "assets/**"
      - ".github/workflows/browser-runtime.yml"
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Isolate startup scripts and verify storefront
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { resolve, extname, sep } from 'node:path';
          const root = process.cwd();
          const types = {'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png'};
          const server = createServer(async (req,res) => {
            try {
              const url = new URL(req.url,'http://localhost');
              const file = resolve(root, '.' + decodeURIComponent(url.pathname === '/' ? '/index.html' : url.pathname));
              if (file !== root && !file.startsWith(root + sep)) throw new Error('invalid path');
              const info = await stat(file);
              if (!info.isFile()) throw new Error('not a file');
              let body = await readFile(file);
              if (url.pathname === '/' || url.pathname.endsWith('/index.html')) {
                const mode = url.searchParams.get('scripts') || 'all';
                let html = body.toString();
                html = html.replace(/<script src="\.\/([^"]+)"[^>]*><\/script>/g, (tag, name) => {
                  const base = name.split('?')[0];
                  return mode === 'all' || mode === base ? tag : '';
                });
                body = Buffer.from(html);
              }
              res.writeHead(200, {'Content-Type':types[extname(file)] || 'application/octet-stream','Cache-Control':'no-store'});
              res.end(body);
            } catch (e) { res.writeHead(404); res.end(String(e)); }
          });
          await new Promise(resolve => server.listen(4173,'127.0.0.1',resolve));
          const browser = await chromium.launch({headless:true});
          const checks = [];
          try {
            for (const mode of ['none','app.js','api-config.js','api-client.js','cart.js','all']) {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              try {
                const response = await page.goto('http://127.0.0.1:4173/?scripts='+mode, {waitUntil:'domcontentloaded',timeout:8000});
                const state = await page.evaluate(() => ({ready:document.readyState,products:document.querySelectorAll('#productGrid .product').length,title:document.title}));
                checks.push({mode,http:response?.status(),state,errors});
                if (state.blocked) { await page.close({runBeforeUnload:false}); break; }
                await page.close();
              } catch (e) { checks.push({mode,error:e.message,errors}); await page.close({runBeforeUnload:false}).catch(()=>{}); break; }
            }
            console.log(JSON.stringify(checks,null,2));
            const full = checks.find(x=>x.mode==='all');
            if (!full || full.state?.blocked || !['interactive','complete'].includes(full.state?.ready) || full.state?.products<500 || full.errors?.length) throw new Error('Full storefront failed startup test');

            // Verify that the homepage search bar routes to the full parts catalog.
            const homeSearchPage = await browser.newPage();
            await homeSearchPage.route('**/functions/v1/store-api/api/products*', async route => {
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({items:[{id:'p1',kind:'PART_REFERENCE',sku:'392-0217',name:'Fuel injector',brand:'Caterpillar',category:'قطعات موتور',machineModel:'3512B / 3516B',compatibleModels:['3508B','3512B','3516B'],technicalGroup:'Fuel system · Injector group',specifications:{length:{value:14.8,unit:'in'},height:{value:3,unit:'in'}},imageUrl:'https://caterpillar.scene7.com/is/image/Caterpillar/CM20231128-59fa0-8c001?fmt=WebP&wid=960',priceIrr:null,stock:0,sourceUrl:'https://parts.cat.com/en/catcorp/product/392-0217'}]})});
            });
            await homeSearchPage.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded',timeout:8000});
            await homeSearchPage.locator('#search').fill('392-0217');
            await homeSearchPage.locator('#quickSearchForm button[type=submit]').click();
            await homeSearchPage.waitForURL('**/search.html?q=392-0217', {timeout:8000});
            await homeSearchPage.waitForSelector('.part-detail-card .part-number', {timeout:8000});
            const homeSearchState = await homeSearchPage.evaluate(() => ({
              path:location.pathname,query:new URLSearchParams(location.search).get('q'),
              cards:document.querySelectorAll('.part-detail-card').length,
              part:document.querySelector('.part-detail-card .part-number')?.textContent.trim(),
              fontLink:document.querySelector('link[href*="family=Estedad"]')?.href||'',
              fontFamily:getComputedStyle(document.querySelector('.search-intro h1')).fontFamily
            }));
            checks.push({mode:'homepage-quick-search',state:homeSearchState});
            if (!homeSearchState.path.endsWith('/search.html') || homeSearchState.query!=='392-0217' || homeSearchState.cards<1 || !homeSearchState.part.includes('392-0217') || !homeSearchState.fontLink.includes('Estedad')) throw new Error('Homepage quick search did not open the styled parts catalog');
            await homeSearchPage.close();
            const searchPage = await browser.newPage();
            const searchErrors = [], searched = [];
            searchPage.on('pageerror', e => searchErrors.push(e.message));
            await searchPage.route('**/functions/v1/store-api/api/products*', async route => {
              const url = new URL(route.request().url());
              searched.push(url.searchParams.get('q'));
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({items:[{id:'p1',kind:'PART_REFERENCE',sku:'392-0217',name:'Fuel injector',brand:'Caterpillar',category:'قطعات موتور',machineModel:'3512B / 3516B',compatibleModels:['3508B','3512B','3516B'],technicalGroup:'Fuel system · Injector group',specifications:{length:{value:14.8,unit:'in'},height:{value:3,unit:'in'}},imageUrl:'https://caterpillar.scene7.com/is/image/Caterpillar/CM20231128-59fa0-8c001?fmt=WebP&wid=960',priceIrr:null,stock:0,sourceUrl:'https://parts.cat.com/en/catcorp/product/392-0217'}]})});
            });
            await searchPage.goto('http://127.0.0.1:4173/search.html',{waitUntil:'domcontentloaded',timeout:8000});
            await searchPage.locator('#partQuery').fill('3512CB');
            await searchPage.locator('#partsSearchForm button[type=submit]').click();
            await searchPage.waitForSelector('.part-detail-card',{timeout:5000});
            const searchState = await searchPage.evaluate(() => ({title:document.title,results:document.querySelectorAll('.part-detail-card').length,shown:document.querySelector('.part-number')?.textContent,availability:document.querySelector('.stock-state')?.textContent,hasInquiry:!!document.querySelector('[data-open-quote]'),image:document.querySelector('.part-image')?.src,dimensions:document.querySelector('.part-spec-grid')?.textContent||''}));
            checks.push({mode:'parts-search',state:searchState,queries:searched,errors:searchErrors});
            console.log('Parts search diagnostic',JSON.stringify({searchState,queries:searched,errors:searchErrors}));
            if (searchState.results!==1 || !searchState.shown.includes('392-0217') || !searchState.availability.includes('کاتالوگ') || !searchState.hasInquiry || !searchState.image.includes('caterpillar.scene7.com') || !searchState.dimensions.includes('14.8') || searched[0]!=='3512CB' || searchErrors.length) throw new Error('Parts search inventory card failed runtime test');
            let quotePayload=null;
            await searchPage.route('**/functions/v1/store-api/api/quotes',async route=>{
              quotePayload=JSON.parse(route.request().postData()||'{}');
              await route.fulfill({status:201,contentType:'application/json',body:JSON.stringify({quote:{quoteNumber:'AQ-TEST123'}})});
            });
            await searchPage.locator('[data-open-quote]').click();
            await searchPage.locator('input[name="name"]').fill('Test Customer');
            await searchPage.locator('input[name="phone"]').fill('09120000000');
            await searchPage.locator('button[type="submit"]').filter({hasText:'ثبت درخواست استعلام'}).click();
            await searchPage.waitForFunction(()=>document.querySelector('.quote-feedback')?.textContent.includes('AQ-TEST123'));
            if(quotePayload?.productSku!=='392-0217'||!quotePayload?.message?.includes('392-0217')) throw new Error('Supplier inquiry payload failed');
            checks.push({mode:'supplier-inquiry',submitted:true,productSku:quotePayload.productSku});
            await searchPage.close();

            // Off Road detail enrichment must merge with Cat Parts records and be searchable by listed alternate part numbers.
            const offRoadMergePage = await browser.newPage();
            await offRoadMergePage.route('**/functions/v1/store-api/api/products*', async route => {
              const q = new URL(route.request().url()).searchParams.get('q');
              const items = q === '1003259' ? [{id:'cat-offroad-1003259',kind:'PART_REFERENCE',sku:'1003259',name:'Cat official reference 1003259',brand:'Caterpillar',category:'قطعات موتور',machineModel:'',compatibleModels:[],technicalGroup:'Fuel system',specifications:{},imageUrl:null,priceIrr:null,stock:0,sourceUrl:'https://parts.cat.com/en/catcorp/product/1003259'}] : [];
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({items})});
            });
            await offRoadMergePage.goto('http://127.0.0.1:4173/search.html?q=1003259',{waitUntil:'domcontentloaded',timeout:8000});
            await offRoadMergePage.waitForSelector('.part-detail-card .part-number',{timeout:8000});
            const mergedOffRoad = await offRoadMergePage.locator('.part-detail-card').innerText();
            const offRoadDiag = await offRoadMergePage.evaluate(() => ({catalogCount:window.AMOOT_OFFROAD_CATALOG?.length,entry:window.AMOOT_OFFROAD_CATALOG?.find(x=>x.sku==='1003259'),card:document.querySelector('.part-detail-card')?.innerText}));
            console.log('Off Road merge diagnostic',JSON.stringify(offRoadDiag));
            if (!mergedOffRoad.includes('1003259') || !mergedOffRoad.includes('6E5280') || !mergedOffRoad.includes('lb') || !mergedOffRoad.includes('دلار آمریکا')) throw new Error('Off Road pricing/weight/alternate references did not merge into Cat search result: '+JSON.stringify(offRoadDiag));
            await offRoadMergePage.close();

            const offRoadAltPage = await browser.newPage();
            await offRoadAltPage.route('**/functions/v1/store-api/api/products*', async route => {
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({items:[]})});
            });
            await offRoadAltPage.goto('http://127.0.0.1:4173/search.html?q=6E5280',{waitUntil:'domcontentloaded',timeout:8000});
            await offRoadAltPage.waitForSelector('.part-detail-card .part-number',{timeout:8000});
            const alternateOffRoad = await offRoadAltPage.locator('.part-detail-card').innerText();
            if (!alternateOffRoad.includes('1003259') || !alternateOffRoad.includes('6E5280') || !alternateOffRoad.includes('دلار آمریکا')) throw new Error('Off Road alternate part number did not resolve to its source part record');
            checks.push({mode:'offroad-catalog-enrichment',mergedCatReference:true,alternatePartSearch:true});
            await offRoadAltPage.close();

            // Verify the actual GitHub Pages site against the deployed Supabase API.
            // This deliberately has no route mocks: browser origin, CORS, scripts and live data are exercised.
            const livePage = await browser.newPage();
            const liveErrors = [];
            livePage.on('pageerror', e => liveErrors.push(e.message));
            const liveResponse = await livePage.goto('https://saeed860.github.io/Amoot-Machine/search.html?q=392-0217', {waitUntil:'domcontentloaded',timeout:25000});
            await livePage.waitForSelector('.part-detail-card .part-number', {timeout:25000});
            const liveState = await livePage.evaluate(() => ({
              title: document.title,
              cards: document.querySelectorAll('.part-detail-card').length,
              partNumbers: [...document.querySelectorAll('.part-detail-card .part-number')].map(x => x.textContent.trim()),
              sourceLinks: document.querySelectorAll('.part-detail-card .part-source a').length,
              inquiryButtons: document.querySelectorAll('.part-detail-card [data-open-quote]').length,
              partImages:[...document.querySelectorAll('.part-detail-card .part-image')].map(img=>img.src)
            }));
            checks.push({mode:'live-production-search',http:liveResponse?.status(),state:liveState,errors:liveErrors});
            if (liveResponse?.status()!==200 || liveState.cards<1 || !liveState.partNumbers.some(x=>x.includes('392-0217')) || !liveState.partImages.some(x=>x.includes('caterpillar.scene7.com')) || liveErrors.length) {
              throw new Error('Live production search did not render the 392-0217 part card');
            }
            await livePage.close();
          } finally {
            await browser.close().catch(()=>{});
            server.closeAllConnections();
            await new Promise(resolve => server.close(resolve));
          }
          NODE
