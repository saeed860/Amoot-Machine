name: Live Part Catalog Smoke Test
on:
  workflow_run:
    workflows: ["Deploy Amoot Machine to Supabase"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  live-api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query deployed Supabase catalog (real API, no mocks)
        run: node scripts/live-part-catalog-smoke.mjs
