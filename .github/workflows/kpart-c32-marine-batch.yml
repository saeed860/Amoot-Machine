name: K-Part C32 Marine Catalog Batch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kpart-c32-marine-batch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture C32 SDN/RSD sea-water heat-exchanger group detail through public UI
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const books=[];
          async function collect(prefix,groupTitle){
            const responses=[];
            const handler=async res=>{
              if(!res.url().includes('/komatsu/komatsu/aiChatProxy')) return;
              if(!(res.headers()['content-type']||'').includes('application/json')) return;
              try { const j=await res.json(); if(j?.ok && j.card) responses.push({url:res.url(),json:j}); } catch {}
            };
            page.on('response',handler);
            let error=null,detail=null,tree=null,book=null;
            try {
              await page.goto('https://k-part.com/chat?catalog_brand=cat',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(2500);
              const accept=page.getByRole('button',{name:'Accept',exact:true});
              if(await accept.count()) await accept.first().click().catch(()=>{});
              await page.waitForTimeout(1000);
              await page.locator('input[name="message"]').fill('C32');
              await page.getByRole('button',{name:'Send',exact:true}).first().click();
              await page.getByRole('button',{name:`C32 / ${prefix}`,exact:true}).waitFor({timeout:45000});
              await page.getByRole('button',{name:`C32 / ${prefix}`,exact:true}).click();
              await page.getByRole('button',{name:'Cooling system',exact:true}).first().waitFor({timeout:45000});
              await page.waitForTimeout(2000);
              const base=[...responses].reverse().find(x=>x.json.card?.cat_snp===prefix && x.json.card?.section_tree);
              book=base?.json.card?.book||`C32 / ${prefix}`;
              tree=base?.json.card?.section_tree||[];
              await page.getByRole('button',{name:'Cooling system',exact:true}).first().click();
              await page.waitForTimeout(1000);
              const target=page.getByText(groupTitle,{exact:true}).first();
              await target.waitFor({timeout:20000});
              const before=responses.length;
              await target.click();
              await page.waitForTimeout(5000);
              const hit=[...responses.slice(before)].reverse().find(x=>Array.isArray(x.json.card?.parts)&&x.json.card.parts.length>0);
              detail=hit?.json?.card||null;
              if(!detail) error='Clicked group but no parts table response was captured';
            } catch(e) { error=e.message; }
            const visibleText=await page.locator('body').innerText().catch(()=> '');
            books.push({model:'C32',serialPrefix:prefix,book,groupTitle,error,sectionCount:tree?.length||0,sections:(tree||[]).map(s=>({section:s.title,count:(s.children||[]).length})),groupDetail:detail,visibleText:visibleText.slice(-9000)});
            page.removeListener('response',handler);
          }
          let fatal=null;
          try {
            await collect('SDN','353-9049 HEAT EXCHANGER GP-SEA WATER');
            await collect('RSD','586-1380 HEAT EXCHANGER GP-SEA WATER');
          } catch(e) { fatal=e.message; }
          await writeFile('artifacts/kpart-c32-marine-groups.json',JSON.stringify({fatal,books,generatedAt:new Date().toISOString()},null,2));
          await browser.close();
          console.log(JSON.stringify({fatal,books:books.map(b=>({prefix:b.serialPrefix,group:b.groupTitle,error:b.error,parts:b.groupDetail?.parts?.length||0,complete:b.groupDetail?.parts_complete??null}))},null,2));
          NODE
      - name: Validate group detail responses
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const d=JSON.parse(await readFile('artifacts/kpart-c32-marine-groups.json','utf8'));
          if(d.fatal) throw new Error(d.fatal);
          if(!d.books.some(x=>x.serialPrefix==='SDN')) throw new Error('SDN missing');
          if(!d.books.some(x=>x.serialPrefix==='RSD')) throw new Error('RSD missing');
          console.log('PASS: both OEM-mapped marine prefixes processed; part detail rows:',d.books.map(x=>x.serialPrefix+':'+(x.groupDetail?.parts?.length||0)).join(', '));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpart-c32-marine-groups
          path: artifacts/kpart-c32-marine-groups.json
          if-no-files-found: warn
          retention-days: 7
