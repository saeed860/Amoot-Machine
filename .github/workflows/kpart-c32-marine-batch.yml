name: K-Part C32 Marine Catalog Batch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kpart-c32-marine-batch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture marine C32 assembly component tables through public K-Part UI
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const books=[];
          const targets={
            SDN:[
              {section:'Air inlet and exhaust',title:'361-1283 AFTERCOOLER GP-RAW WATER'},
              {section:'Fuel system',title:'207-2422 FILTER GP-WATER SEP & FUEL'},
              {section:'Electrical and electronics',title:'305-8921 ALTERNATOR GP-CHARGING'},
              {section:'Air inlet and exhaust',title:'418-9241 PLUG GP-EXHAUST -WATER COOLED'}
            ],
            RSD:[
              {section:'Cooling system',title:'418-8363 PUMP GP-AUXILIARY SEA WATER'},
              {section:'Fuel system',title:'207-2422 FILTER GP-WATER SEP & FUEL'},
              {section:'Electrical and electronics',title:'344-3387 SENSOR GP-PRESSURE -SEA WATER'},
              {section:'Electrical and electronics',title:'562-4336 INSTALLATION AR-COMMUNICATION -MARINE'}
            ]
          };
          async function collectBook(prefix){
            const responses=[];
            const handler=async res=>{
              if(!res.url().includes('/komatsu/komatsu/aiChatProxy')) return;
              if(!(res.headers()['content-type']||'').includes('application/json')) return;
              try { const j=await res.json(); if(j?.ok && j.card) responses.push({url:res.url(),json:j}); } catch {}
            };
            page.on('response',handler);
            let fatal=null,tree=[];
            const groups=[];
            try{
              await page.goto('https://k-part.com/chat?catalog_brand=cat',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(2200);
              const accept=page.getByRole('button',{name:'Accept',exact:true});
              if(await accept.count()) await accept.first().click().catch(()=>{});
              await page.waitForTimeout(700);
              await page.locator('input[name="message"]').fill('C32');
              await page.getByRole('button',{name:'Send',exact:true}).first().click();
              await page.getByRole('button',{name:`C32 / ${prefix}`,exact:true}).waitFor({timeout:45000});
              await page.getByRole('button',{name:`C32 / ${prefix}`,exact:true}).click();
              await page.getByRole('button',{name:'Cooling system',exact:true}).first().waitFor({timeout:45000});
              await page.waitForTimeout(1800);
              const base=[...responses].reverse().find(x=>x.json.card?.cat_snp===prefix && x.json.card?.section_tree);
              tree=base?.json.card?.section_tree||[];
              for(const t of targets[prefix]){
                const entry={section:t.section,title:t.title,error:null,detail:null};
                try{
                  const section=page.getByRole('button',{name:t.section,exact:true}).first();
                  await section.waitFor({timeout:12000});
                  await section.click();
                  await page.waitForTimeout(700);
                  const target=page.getByText(t.title,{exact:true}).first();
                  await target.waitFor({timeout:12000});
                  const before=responses.length;
                  await target.click();
                  await page.waitForTimeout(3500);
                  const hit=[...responses.slice(before)].reverse().find(x=>Array.isArray(x.json.card?.parts)&&x.json.card.parts.length>0);
                  entry.detail=hit?.json?.card||null;
                  if(!entry.detail) entry.error='No component table response captured after visible group selection';
                }catch(e){entry.error=e.message;}
                groups.push(entry);
              }
            }catch(e){fatal=e.message;}
            books.push({model:'C32',serialPrefix:prefix,fatal,sectionCount:tree.length,sections:tree.map(s=>({section:s.title,count:(s.children||[]).length})),groups});
            page.removeListener('response',handler);
          }
          try{await collectBook('SDN');await collectBook('RSD');}
          finally{
            await writeFile('artifacts/kpart-c32-marine-groups.json',JSON.stringify({books,generatedAt:new Date().toISOString()},null,2));
            await browser.close();
          }
          console.log(JSON.stringify(books.map(b=>({prefix:b.serialPrefix,fatal:b.fatal,groups:b.groups.map(g=>({title:g.title,error:g.error,parts:g.detail?.parts?.filter(p=>p.number)?.length||0}))})),null,2));
          NODE
      - name: Validate captured component tables
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const d=JSON.parse(await readFile('artifacts/kpart-c32-marine-groups.json','utf8'));
          if(!d.books.some(b=>b.serialPrefix==='SDN')||!d.books.some(b=>b.serialPrefix==='RSD')) throw new Error('Marine books missing');
          const found=d.books.flatMap(b=>b.groups||[]).filter(g=>g.detail?.parts?.some(p=>p.number));
          if(!found.length) throw new Error('No component rows captured');
          console.log('PASS: public K-Part UI returned component tables for '+found.length+' groups; rows='+found.reduce((n,g)=>n+g.detail.parts.filter(p=>p.number).length,0));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpart-c32-marine-groups
          path: artifacts/kpart-c32-marine-groups.json
          if-no-files-found: warn
          retention-days: 7
