name: K-Part C32 Marine Catalog Batch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kpart-c32-marine-batch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Collect C32 marine prefix section trees via public UI
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const all=[];
          async function collect(prefix){
            const responses=[];
            page.on('response', async function handler(res){
              if(!res.url().includes('/komatsu/komatsu/aiChatProxy')) return;
              if(!(res.headers()['content-type']||'').includes('application/json')) return;
              try {
                const j=await res.json();
                if(j?.ok && j.card?.section_tree) responses.push({url:res.url(),json:j});
              } catch {}
            });
            await page.goto('https://k-part.com/chat?catalog_brand=cat',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(3500);
            const accept=page.getByRole('button',{name:'Accept',exact:true});
            if(await accept.count()) await accept.first().click().catch(()=>{});
            await page.waitForTimeout(1000);
            await page.locator('input[name="message"]').fill('C32');
            await page.getByRole('button',{name:'Send',exact:true}).first().click();
            await page.getByRole('button',{name:`C32 / ${prefix}`,exact:true}).waitFor({timeout:45000});
            await page.getByRole('button',{name:`C32 / ${prefix}`,exact:true}).click();
            await page.waitForFunction(() => document.body.innerText.includes('Choose a catalog section'),null,{timeout:45000}).catch(()=>{});
            await page.waitForTimeout(3000);
            const hit=responses.find(x=>x.json.card.cat_snp===prefix) || responses.at(-1);
            const text=await page.locator('body').innerText();
            const tree=hit?.json?.card?.section_tree||[];
            const sections=tree.map(s=>({section:s.title,count:(s.children||[]).length,groups:(s.children||[]).map(c=>c.title)}));
            all.push({model:'C32',serialPrefix:prefix,book:hit?.json?.card?.book||`C32 / ${prefix}`,media:hit?.json?.card?.cat_media||null,sections,rawCard:hit?.json?.card||null,visibleText:text.slice(-12000)});
            await page.removeAllListeners('response');
          }
          let error=null;
          try {
            await collect('SDN');
            await collect('RSD');
          } catch(e) { error=e.message; }
          await writeFile('artifacts/kpart-c32-marine-batch.json',JSON.stringify({error,books:all,generatedAt:new Date().toISOString()},null,2));
          await browser.close();
          console.log(JSON.stringify({error,books:all.map(b=>({prefix:b.serialPrefix,media:b.media,sections:b.sections.map(s=>({section:s.section,count:s.count}))}))},null,2));
          NODE
      - name: Validate collected catalog tree
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const d=JSON.parse(await readFile('artifacts/kpart-c32-marine-batch.json','utf8'));
          if(d.error) throw new Error(d.error);
          for(const p of ['SDN','RSD']) {
            const b=d.books.find(x=>x.serialPrefix===p);
            if(!b) throw new Error('Missing marine prefix '+p);
            if(!b.sections.length) throw new Error('No section tree for '+p);
          }
          console.log('PASS: SDN and RSD catalog trees captured');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpart-c32-marine-batch
          path: artifacts/kpart-c32-marine-batch.json
          if-no-files-found: warn
          retention-days: 7
