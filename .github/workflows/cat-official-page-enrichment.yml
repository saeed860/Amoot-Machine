name: Experimental - Cat Parts Page Enrichment (Manual Only)

on:
  workflow_dispatch:
    inputs:
      batch_start:
        description: "Zero-based offset in the official Cat part-number list (currently 3877)"
        required: true
        default: "0"
      batch_size:
        description: "Parts to process in this run (maximum 150)"
        required: true
        default: "100"

permissions:
  contents: write

concurrency:
  group: cat-official-enrichment
  cancel-in-progress: false

# Experimental only: parts.cat.com page navigation repeatedly timed out at the initial product URLs.
# Curated official Cat pages/PDF guides and separately attributed cross-reference files are the active path.
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAT_BATCH_START: ${{ github.event.inputs.batch_start || '0' }}
      CAT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate extractor syntax
        run: node --check scripts/enrich-cat-official-pages.mjs

      - name: Restore this batch checkpoint
        uses: actions/cache@v4
        with:
          path: artifacts/cat-official-enrichment-checkpoint-${{ env.CAT_BATCH_START }}.json
          key: cat-official-enrichment-v2-${{ env.CAT_BATCH_START }}-${{ github.run_id }}
          restore-keys: |
            cat-official-enrichment-v2-${{ env.CAT_BATCH_START }}-
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Extract public Cat Parts product metadata (no account prices)
        run: node scripts/enrich-cat-official-pages.mjs
      - name: Commit batch metadata migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_enrich_cat_official_page_metadata_batch_*.sql artifacts/cat-official-enrichment.json
          if git diff --cached --quiet; then echo "No new Cat metadata updates"; exit 0; fi
          git commit -m "catalog: enrich official Cat metadata batch ${CAT_BATCH_START}"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-official-enrichment-batch-${{ env.CAT_BATCH_START }}
          path: |
            artifacts/cat-official-enrichment.json
            artifacts/cat-official-enrichment-checkpoint-${{ env.CAT_BATCH_START }}.json
          if-no-files-found: warn
          retention-days: 30
