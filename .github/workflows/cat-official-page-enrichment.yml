name: Enrich Official Cat Parts Metadata

on:
  push:
    branches: [main]
    paths:
      - "scripts/enrich-cat-official-pages.mjs"
      - "data/cat-official-part-numbers.txt"
      - ".github/workflows/cat-official-page-enrichment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Cat enrichment checkpoint
        uses: actions/cache@v4
        with:
          path: artifacts/cat-official-enrichment-checkpoint.json
          key: cat-official-enrichment-v1
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Extract public Cat Parts product metadata (no account prices)
        run: node scripts/enrich-cat-official-pages.mjs
      - name: Commit reviewed source metadata migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_enrich_cat_official_page_metadata.sql artifacts/cat-official-enrichment.json
          if git diff --cached --quiet; then echo "No Cat metadata updates"; exit 0; fi
          git commit -m "catalog: enrich official Cat part descriptions and fitment metadata"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-official-page-enrichment
          path: artifacts/cat-official-enrichment.json
          if-no-files-found: warn
          retention-days: 14
